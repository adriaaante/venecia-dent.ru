    <linearGradient id="lagoon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12776F"/>
      <stop offset="1" stop-color="#0A4A46"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#lagoon)"/>
