    31 0 28-80 75-80s44 80 75 80c21 0 32-21 40-60 14-67 55-94 55-178 0-54-30-96-84-96-35 0-53 18-86 18
    z
    M256 192
    c-18 16-40 24-40 56 v56 a10 10 0 0 0 10 10 h60 a10 10 0 0 0 10-10 v-56 c0-32-22-40-40-56
    z"/>
